<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Yawa Khim — Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="manage.css?v=3">
  <script type="module" src="manage.js?v=2"></script>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <a class="admin-brand" href="index.html"><span class="admin-mark" aria-hidden="true">YK</span><span>Yawa Khim<small>Private management</small></span></a>
      <a class="back-link" href="index.html">View public site <span aria-hidden="true">↗</span></a>
    </header>

    <section class="login-panel" id="login-panel" aria-labelledby="login-heading">
      <p class="admin-kicker">Private access</p>
      <h1 id="login-heading">Welcome back.</h1>
      <p>Sign in to update Yawa Mart products and hotel room listings.</p>
      <form id="login-form">
        <label for="email">Admin email</label>
        <input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
        <button class="admin-button" id="login-button" type="submit">Sign in</button>
      </form>
      <p class="status-message" id="login-status" role="status" aria-live="polite"></p>
    </section>

    <section class="dashboard" id="dashboard" hidden aria-labelledby="dashboard-heading">
      <div class="dashboard-heading">
        <div><p class="admin-kicker">Catalog management</p><h1 id="dashboard-heading">Your listings.</h1></div>
        <button class="secondary-button" id="logout-button" type="button">Sign out</button>
      </div>
      <div class="dashboard-grid">
        <section class="editor-panel" aria-labelledby="editor-heading">
          <h2 id="editor-heading">Add a listing</h2>
          <form id="listing-form" enctype="multipart/form-data">
            <input id="listing-id" name="id" type="hidden">
            <label for="listing-type">Listing type</label>
            <select id="listing-type" name="type">
              <option value="product">Yawa Mart product</option>
              <option value="room">Hotel room</option>
              <option value="special_food">Hotel special food</option>
            </select>
            <label for="listing-name" id="name-label">Product name</label>
            <input id="listing-name" name="name" type="text" required maxlength="120">
            <label for="listing-description">Description</label>
            <textarea id="listing-description" name="description" rows="4" required maxlength="1000"></textarea>
            <label for="listing-price" id="price-label">Price (Rs.)</label>
            <input id="listing-price" name="price" type="number" min="0.01" max="99999999" step="0.01" required>
            <label for="listing-available" id="availability-label">Stock status</label>
            <select id="listing-available" name="available">
              <option value="true">In stock / Available</option>
              <option value="false">Out of stock / Unavailable</option>
            </select>
            <label for="listing-image">Image <span class="field-note">(JPEG, PNG, or WebP; up to 5 MB)</span></label>
            <input id="listing-image" name="image" type="file" accept="image/jpeg,image/png,image/webp">
            <div class="form-actions">
              <button class="admin-button" id="save-button" type="submit">Save listing</button>
              <button class="secondary-button" id="cancel-edit" type="button" hidden>Cancel edit</button>
            </div>
          </form>
          <p class="status-message" id="editor-status" role="status" aria-live="polite"></p>
        </section>

        <section class="listings-panel" aria-labelledby="listings-heading">
          <div class="listings-heading"><h2 id="listings-heading">Current listings</h2><button class="secondary-button" id="refresh-button" type="button">Refresh</button></div>
          <div class="listing-filters">
            <label for="listing-type-filter">Listing type
              <select id="listing-type-filter">
                <option value="all">All listings</option>
                <option value="product">Mart products</option>
                <option value="room">Hotel rooms</option>
                <option value="special_food">Hotel special food</option>
              </select>
            </label>
            <label for="listing-status-filter">Availability
              <select id="listing-status-filter">
                <option value="all">All statuses</option>
                <option value="available">Available / in stock</option>
                <option value="unavailable">Unavailable / out of stock</option>
              </select>
            </label>
          </div>
          <div class="admin-listings" id="admin-listings" aria-live="polite"></div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
